<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundWalk</title> 
    <link rel="stylesheet" href="ellastyle.css">
    <link rel="stylesheet" href="aurorastyle.css">
    <link rel="stylesheet" href="filippo-jesse.css">
</head>

<body>

    <!-- HOME -->
    <div id="home" class="page">
        <div class="container">
            <img src="consverticale.jpeg" class="background">
            <button class="btn btn-entra" onclick="mostraPagina('menu')">
                Entra
            </button>
        </div>
    </div>

  <!-- MENU -->
<div id="menu" class="page hidden">
    <div class="container">
        <img src="prova_2.jpeg" class="background">

        <button class="btn b1" onclick="mostraPagina('pianoforte')">
            131
        </button>

        <button class="btn b2" onclick="mostraPagina('corridoio')">
            Corridoio
        </button>
    </div>
</div>


    <!-- PIANOFORTE -->
    <div id="pianoforte" class="page hidden">
        <div class="container">
            <h1>Pianoforte</h1>

            <button class="btn" onclick="avviaPianoforte()">
                Avvia
            </button>

            <button class="btn" onclick="mostraPagina('menu')">
                Torna indietro
            </button>
        </div>
    </div>

   <!-- CORRIDOIO -->
<div id="corridoio" class="page hidden">
    <div class="header">
        <p class="sottotitolo">Quando l'immagine diventa suono</p>
        <h1>Visual Soundwalk</h1>
        <div class="divisore"></div>
        <p class="descrizione">
            Inquadra ciò che ti circonda. <br>
            Installazione interattiva.
        </p>
    </div>

    <button id="btnAvvia" class="btn center" onclick="avviaCorridoio()">Avvia</button>

    <video id="video" autoplay playsinline muted></video>

    <div class="riquadro1">
        <div class="riquadro">
            <p class="riquadro2">Luminosità</p>
            <div id="luminosita">0%</div>
        </div>
        <div class="riquadro">
            <p class="riquadro2">RGB</p>
            <div id="rgbDisplay">R 0%  G 0%  B 0%</div>
        </div>
    </div>

    <div id="parzialiDisplay">
        Parziali — R:0  G:0  B:0
    </div>

    <button id="btnTorna" class="btn" onclick="tornaMenu()">Torna indietro</button>
</div>

    <script src="installazione_ella.js"></script>
    <script src="aurora.js"></script>
    <script src="filippo-jesse.js"></script>
    <script src="function.js"></script>

</body>
</html>
